<!DOCTYPE HTML>

<html>
	<head>
		<title>Contact Us | Aura BioVisuals Studio</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
		<style>
			/* Intro Header Logo and Single Line Title Styling */
			#intro .intro-logo {
				max-width: 140px;
				height: auto;
				margin-bottom: 1.5em;
				display: inline-block;
			}
			#intro h1 {
				white-space: nowrap;
				font-size: 3.2em;
			}
			@media screen and (max-width: 980px) {
				#intro h1 { font-size: 2.4em; }
			}
			@media screen and (max-width: 736px) {
				#intro h1 { font-size: 1.8em; white-space: normal; }
				#intro .intro-logo { max-width: 100px; }
			}

			/* Custom Centered Contact Section */
			.contact-page-container {
				width: 100%;
				max-width: 780px;
				margin: 0 auto;
				text-align: center;
				padding: 2em 0;
			}
			.contact-heading {
				font-size: 1.35em;
				font-weight: 700;
				line-height: 1.5;
				margin-bottom: 2em;
				color: inherit;
				letter-spacing: 0.03em;
			}
			.contact-page-container form {
				text-align: left;
				max-width: 680px;
				margin: 0 auto;
			}
			.contact-page-container .actions {
				justify-content: center;
				display: flex;
				margin-top: 1.5em;
			}
		</style>
	</head>
	<body class="is-preload">

		<!-- Wrapper -->
			<div id="wrapper">

				<!-- Header -->
					<header id="header">
						<a href="index.html" class="logo">Aura BioVisuals</a>
					</header>

				<!-- Nav -->
					<nav id="nav">
						<ul class="links">
							<li><a href="index.html">Services & Visual Solutions</a></li>
							<li><a href="about.html">About Us</a></li>
							<li class="active"><a href="contact.html">Contact Us</a></li>
						</ul>
						<ul class="icons">
							<li><a href="https://www.linkedin.com/in/parinaz-ghanbari/" target="_blank" class="icon brands fa-linkedin"><span class="label">LinkedIn</span></a></li>
							<li><a href="https://www.instagram.com/" target="_blank" class="icon brands fa-instagram"><span class="label">Instagram</span></a></li>
							<li><a href="https://twitter.com/" target="_blank" class="icon brands fa-twitter"><span class="label">Twitter</span></a></li>
						</ul>
					</nav>

				<!-- Main -->
					<div id="main">

						<!-- Contact Us Section -->
							<section class="post">
								<div class="contact-page-container">
									<header class="major">
										<h2>Get In Touch</h2>
									</header>
									<h3 class="contact-heading">Send us a description of your project,<br />and we will respond within 24 hours.</h3>
									<form method="POST" action="https://formspree.io/f/YOUR_FORMSPREE_ID">
										<div class="fields">
											<div class="field">
												<label for="name">Name</label>
												<input type="text" name="name" id="name" required />
											</div>
											<div class="field">
												<label for="email">Email</label>
												<input type="email" name="email" id="email" required />
											</div>
											<div class="field">
												<label for="message">Project Details / Inquiry</label>
												<textarea name="message" id="message" rows="5" required></textarea>
											</div>
										</div>
										<ul class="actions">
											<li><input type="submit" value="Send Inquiry" /></li>
										</ul>
									</form>
								</div>
							</section>

					</div>

				<!-- Copyright -->
					<div id="copyright">
						<ul><li>&copy; Aura BioVisuals Studio</li><li>Design: <a href="https://html5up.net">HTML5 UP</a></li></ul>
					</div>

			</div>

		<!-- Scripts -->
			<script src="assets/js/jquery.min.js"></script>
			<script src="assets/js/jquery.scrollex.min.js"></script>
			<script src="assets/js/jquery.scrolly.min.js"></script>
			<script src="assets/js/browser.min.js"></script>
			<script src="assets/js/breakpoints.min.js"></script>
			<script src="assets/js/util.js"></script>
			<script src="assets/js/main.js"></script>

	</body>
</html>
